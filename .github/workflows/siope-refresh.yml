name: SIOPE municipal snapshot

on:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when source validators are unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: siope-municipal-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: source-operations
    env:
      PYTHONPATH: scripts/etl
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Setup Node.js for the independent snapshot contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Build snapshot
        shell: bash
        env:
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${FORCE_REFRESH}" == "true" ]]; then
            args+=(--force)
          fi
          years=(2024 2025 2026)
          for year in "${years[@]}"; do
            case "${year}" in
              2024)
                output="src/data/generated/siope-municipal-2024.json"
                detail_output="src/data/generated/siope-municipal-detail-2024.json"
                ;;
              2025)
                output="src/data/generated/siope-municipal-2025.json"
                detail_output="src/data/generated/siope-municipal-detail-2025.json"
                ;;
              2026)
                output="src/data/generated/siope-municipal.json"
                detail_output="src/data/generated/siope-municipal-detail.json"
                ;;
              *) echo "Unsupported SIOPE snapshot year: ${year}" >&2; exit 1 ;;
            esac
            python scripts/etl/siope_municipal_snapshot.py \
              --year "${year}" \
              --output "${output}" \
              --detail-output "${detail_output}" \
              "${args[@]}"
          done

      - name: Validate generated contract
        run: python scripts/etl/siope_snapshot_check.py

      - name: Validate every published SIOPE year with the runtime contract
        run: >-
          node --experimental-strip-types --test
          tests/siope-snapshot.test.mjs
          tests/municipality-profile.test.mjs
      - name: Publish generated data
        uses: ./.github/actions/publish-data-refresh
        with:
          artifact-id: siope-municipal
          app-client-id: ${{ vars.DATA_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DATA_BOT_APP_PRIVATE_KEY }}
