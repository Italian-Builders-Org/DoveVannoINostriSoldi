name: PNRR childcare snapshot

on:
  push:
    branches: [main]
    paths:
      - scripts/etl/specs/pnrr-childcare.source.json
      - scripts/etl/pnrr_childcare_snapshot.py
      - tests/etl/test_pnrr_childcare_snapshot.py
      - src/data/generated/pnrr-childcare.data.json
      - src/data/generated/pnrr-childcare.meta.json
      - .github/workflows/pnrr-childcare-refresh.yml
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
    inputs:
      observed_at:
        description: "UTC observation time, for example 2026-08-21T00:00:00Z"
        required: true
        type: string

# contents: read — least-privilege: only read repository contents.
permissions:
  contents: read

concurrency:
  group: pnrr-childcare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: offline-contract
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test the fail-closed transformer
        run: python -m unittest -v tests/etl/test_pnrr_childcare_snapshot.py
      - name: Validate committed hash-bound artifacts
        run: python scripts/etl/pnrr_childcare_snapshot.py --check

  verify-upstream:
    name: verify-upstream
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify all four locked official CSVs
        shell: python
        run: |
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          spec = json.loads(Path("scripts/etl/specs/pnrr-childcare.source.json").read_text())
          failures = []
          for label, asset in spec["source"]["assets"].items():
              request = urllib.request.Request(
                  asset["url"],
                  headers={"User-Agent": "DoveVannoINostriSoldi/PNRR-source-monitor"},
              )
              digest = hashlib.sha256()
              size = 0
              with urllib.request.urlopen(request, timeout=90) as response:
                  while block := response.read(1024 * 1024):
                      digest.update(block)
                      size += len(block)
              observed_hash = digest.hexdigest()
              if size != asset["bytes"] or observed_hash != asset["sha256"]:
                  failures.append(f"{label}: bytes={size}, sha256={observed_hash}")
          if failures:
              for failure in failures:
                  print(f"::warning title=ItaliaDomani source update::{failure}")
              raise SystemExit("ItaliaDomani changed: review and update the source lock")
          print("All locked ItaliaDomani CSVs are unchanged")

  regenerate-manually:
    name: regenerate-manually
    if: github.event_name == 'workflow_dispatch'
    needs: verify-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OBSERVED_AT: ${{ inputs.observed_at }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download locked official assets
        shell: python
        run: |
          import json
          import os
          import urllib.request
          from pathlib import Path

          spec = json.loads(Path("scripts/etl/specs/pnrr-childcare.source.json").read_text())
          target = Path(os.environ["RUNNER_TEMP"], "pnrr-childcare")
          target.mkdir()
          for asset in spec["source"]["assets"].values():
              request = urllib.request.Request(
                  asset["url"],
                  headers={"User-Agent": "DoveVannoINostriSoldi/PNRR-manual-refresh"},
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  with (target / asset["fileName"]).open("wb") as output:
                      while block := response.read(1024 * 1024):
                          output.write(block)
      - name: Regenerate the reviewed candidate
        run: >-
          python scripts/etl/pnrr_childcare_snapshot.py
          --projects-input "${RUNNER_TEMP}/pnrr-childcare/PNRR_Progetti.csv"
          --locations-input "${RUNNER_TEMP}/pnrr-childcare/PNRR_Localizzazione.csv"
          --tenders-input "${RUNNER_TEMP}/pnrr-childcare/PNRR_Gare.csv"
          --awardees-input "${RUNNER_TEMP}/pnrr-childcare/PNRR_Aggiudicatari_Gare.csv"
          --observed-at "${OBSERVED_AT}"
      - name: Verify generated artifacts offline
        run: |
          python -m unittest -v tests/etl/test_pnrr_childcare_snapshot.py
          python scripts/etl/pnrr_childcare_snapshot.py --check
      - name: Upload regeneration candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pnrr-childcare-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src/data/generated/pnrr-childcare.data.json
            src/data/generated/pnrr-childcare.meta.json
