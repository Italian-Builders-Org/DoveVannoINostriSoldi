name: Report workspace
on:
  push:
    branches: [codex/report-overall-verification-20260914]
    paths: [.github/workflows/report-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Archivio dei soli file tracciati
        run: |
          git archive --format=tar.gz --output=/tmp/report-workspace.tar.gz HEAD
          git rev-parse HEAD > /tmp/report-workspace-sha.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: report-workspace
          path: |
            /tmp/report-workspace.tar.gz
            /tmp/report-workspace-sha.txt
          retention-days: 1
          if-no-files-found: error
