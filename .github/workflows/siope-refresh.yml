name: SIOPE municipal snapshot

on:
  push:
    branches:
      - main
      - feat/siope-territorial-dashboard
    paths:
      - scripts/etl/siope_municipal_snapshot.py
      - scripts/etl/siope_snapshot_check.py
      - src/lib/siope-municipality-detail.ts
      - tests/municipality-profile.test.mjs
      - tests/siope-snapshot.test.mjs
      - .github/workflows/siope-refresh.yml
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when source validators are unchanged
        required: false
        default: false
        type: boolean

permissions:
  # contents: read — default. Write permission is scoped to the job below.
  contents: read

concurrency:
  group: siope-municipal-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Direct-push data workflow: PR4 will replace with bot PRs.
    permissions:
      contents: write # Required to push the refreshed snapshot commit directly
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      PYTHONPATH: scripts/etl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Setup Node.js for the independent snapshot contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Build snapshot
        shell: bash
        env:
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${FORCE_REFRESH}" == "true" ]]; then
            args+=(--force)
          fi
          years=(2024 2025 2026)
          for year in "${years[@]}"; do
            case "${year}" in
              2024)
                output="src/data/generated/siope-municipal-2024.json"
                detail_output="src/data/generated/siope-municipal-detail-2024.json"
                ;;
              2025)
                output="src/data/generated/siope-municipal-2025.json"
                detail_output="src/data/generated/siope-municipal-detail-2025.json"
                ;;
              2026)
                output="src/data/generated/siope-municipal.json"
                detail_output="src/data/generated/siope-municipal-detail.json"
                ;;
              *) echo "Unsupported SIOPE snapshot year: ${year}" >&2; exit 1 ;;
            esac
            python scripts/etl/siope_municipal_snapshot.py \
              --year "${year}" \
              --output "${output}" \
              --detail-output "${detail_output}" \
              "${args[@]}"
          done

      - name: Validate generated contract
        run: python scripts/etl/siope_snapshot_check.py

      - name: Validate every published SIOPE year with the runtime contract
        run: >-
          node --experimental-strip-types --test
          tests/siope-snapshot.test.mjs
          tests/municipality-profile.test.mjs

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          artifacts=(
            src/data/generated/siope-municipal-2024.json
            src/data/generated/siope-municipal-2025.json
            src/data/generated/siope-municipal.json
            src/data/generated/siope-municipal-detail-2024.json
            src/data/generated/siope-municipal-detail-2025.json
            src/data/generated/siope-municipal-detail.json
          )
          if [[ -z "$(git status --porcelain -- "${artifacts[@]}")" ]]; then
            echo "No SIOPE snapshot change to commit."
            exit 0
          fi

          git config user.name "dove-vanno-i-nostri-soldi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${artifacts[@]}"
          git commit -m "chore(data): refresh SIOPE municipal snapshot"

          # The ETL can take several minutes. If another commit landed while it
          # was running, replay the data-only commit on top of the latest branch
          # head instead of failing with a non-fast-forward push.
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
