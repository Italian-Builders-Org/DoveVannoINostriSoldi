name: Consulenti Pubblici national snapshot

on:
  push:
    branches: [main]
    paths:
      - scripts/etl/consulenti_snapshot.py
      - src/lib/data/consulenti-contract.ts
      - src/data/generated/consulenti-overview.json
      - tests/consulenti-contract.test.mjs
      - .github/workflows/consulenti-refresh.yml
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

# contents: read — least-privilege: only read repository contents.
permissions:
  contents: read

concurrency:
  group: consulenti-pubblici-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write # Required to push the refreshed snapshot commit directly
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Refresh official statistics
        run: python scripts/etl/consulenti_snapshot.py
      - name: Validate offline snapshot
        run: python scripts/etl/consulenti_snapshot.py --check
      - name: Commit changed official data
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- src/data/generated/consulenti-overview.json)" ]]; then
            echo "No Consulenti Pubblici data change to commit."
            exit 0
          fi
          git config user.name "dove-vanno-i-nostri-soldi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated/consulenti-overview.json
          git commit -m "chore(data): refresh Consulenti Pubblici snapshot"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
