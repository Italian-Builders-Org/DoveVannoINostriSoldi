name: Source health

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

# contents: read — least-privilege: only read repository contents.
permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: ubuntu-24.04
    environment: source-operations
    timeout-minutes: 5
    env:
      CANONICAL_BASE_URL: https://www.dovevannoinostrisoldi.com
    steps:
      - name: Probe active source adapters
        shell: bash
        run: |
          set -euo pipefail

          base_url="${CANONICAL_BASE_URL%/}"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 1 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            "${base_url}/api/fonti/stato" \
            --output /tmp/source-health.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/source-health.json', 'utf8'));
          if (!payload.ok || !Array.isArray(payload.sources)) {
            throw new Error('Invalid source-health response');
          }

          const active = payload.sources.filter((source) => source.integration === 'active');
          const down = active.filter((source) => source.reachability === 'down');
          const openbdap = payload.sources.find((source) => source.sourceId === 'openbdap');
          const ssn = openbdap?.snapshot;
          if (!ssn || ssn.status !== 'verified' || ssn.runtimeFetch !== false || ssn.check !== 'offline-source-lock-and-snapshot-contract') {
            throw new Error('SSN Conto Economico snapshot health is not verified');
          }
          const datasets = ssn.datasets ?? {};
          const expectedRows = { entities: 76124, national: 5, regional: 105 };
          for (const [name, expected] of Object.entries(expectedRows)) {
            const dataset = datasets[name];
            if (!dataset || dataset.status !== 'verified' || dataset.expectedRows !== expected || !/^[a-f0-9]{64}$/.test(dataset.sourceSha256)) {
              throw new Error(`SSN source lock check failed for ${name}`);
            }
          }
          if (!ssn.artifact || ssn.artifact.bytes !== 126487 || !/^[a-f0-9]{64}$/.test(ssn.artifact.sha256) || !/^[a-f0-9]{64}$/.test(ssn.artifact.lockSha256)) {
            throw new Error('SSN snapshot artifact integrity check failed');
          }

          console.log(JSON.stringify({
            observedAt: payload.observedAt,
            active: active.map((source) => ({
              id: source.sourceId,
              reachability: source.reachability,
              latencyMs: source.latencyMs,
              detail: source.detail,
            })),
            ssnSnapshot: {
              status: ssn.status,
              artifact: ssn.artifact,
              datasets: Object.fromEntries(Object.entries(datasets).map(([name, dataset]) => [name, {
                datasetId: dataset.datasetId,
                expectedRows: dataset.expectedRows,
                sourceSha256: dataset.sourceSha256,
              }])),
            },
          }, null, 2));

          if (down.length > 0) {
            const names = down.map((source) => source.sourceId).join(', ');
            throw new Error(`Active official sources unreachable: ${names}`);
          }
          NODE
