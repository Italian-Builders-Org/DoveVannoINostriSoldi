name: Source health

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

# contents: read — least-privilege: only read repository contents.
permissions:
  contents: read

# cancel-in-progress: false — a probe that is already running, or already
# waiting, is the observation we want. A newer schedule must never discard it.
concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  probe:
    name: probe
    runs-on: ubuntu-24.04
    # No environment gate on purpose: this job reads public endpoints and uses no
    # secret. The source-operations environment guards the data-bot credential
    # that refresh workflows need to open pull requests; behind its required
    # reviewers a scheduled run waits for a human, so an unattended monitor
    # would never observe anything.
    timeout-minutes: 8
    env:
      CANONICAL_BASE_URL: https://www.dovevannoinostrisoldi.com
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Install locked runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Probe active source adapters
        shell: bash
        run: |
          set -euo pipefail

          base_url="${CANONICAL_BASE_URL%/}"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 1 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            "${base_url}/api/fonti/stato" \
            --output /tmp/source-health.json

          node --experimental-strip-types --import ./scripts/ci/register-source-alias.mjs scripts/source-health.mjs /tmp/source-health.json
