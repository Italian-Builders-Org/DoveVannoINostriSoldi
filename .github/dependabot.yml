version: 2
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    groups:
      npm-compatible:
        update-types:
          - patch
          - minor
    # Major da coordinare con runtime e plugin, non aggiornamenti ordinari.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 1
    groups:
      actions-compatible:
        update-types: [patch, minor]
