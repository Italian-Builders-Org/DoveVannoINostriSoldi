name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Event-aware concurrency:
# - PR: a new commit cancels the previous run (same PR number → same group).
# - main: every commit completes its own verification (unique SHA → unique group,
#   so a newer push can never cancel an older one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/check-whitespace.sh

      - name: Lint, typecheck, design and brand checks
        run: npm run ci:static

      - name: Actionlint
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp
          /tmp/actionlint -color

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node test suite
        run: npm run test:node

  etl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PYTHONPATH for ETL scripts that import sibling modules.
      # The offline guard (DVNS_OFFLINE_GUARD) is set per-step below,
      # AFTER dependency installation, so pip can reach PyPI.
      PYTHONPATH: scripts/etl:scripts/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned ETL dependencies
        run: >-
          python -m pip install --no-deps --only-binary=:all:
          --require-hashes -r requirements-etl.txt

      - name: ETL test suite (offline)
        env:
          DVNS_OFFLINE_GUARD: "1"
        run: npm run test:etl

      - name: Validate committed generated artifacts (offline)
        env:
          DVNS_OFFLINE_GUARD: "1"
        run: npm run test:snapshots

      - name: ETL gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ETL gate"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| ETL test suite (offline) | ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Generated-artifact registry + offline checks | ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Application-level network guard | active (loopback only) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Production gates (server readiness, MCP, browser, Lighthouse)
        run: bash scripts/ci/run-production-gates.sh

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-irpef
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-server-log
          path: /tmp/dvns-next.log
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: required
    needs: [static, node, etl, production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate gate results
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          NODE_RESULT: ${{ needs.node.result }}
          ETL_RESULT: ${{ needs.etl.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          {
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| static | ${STATIC_RESULT} |"
            echo "| node | ${NODE_RESULT} |"
            echo "| etl | ${ETL_RESULT} |"
            echo "| production | ${PRODUCTION_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$STATIC_RESULT" "$NODE_RESULT" "$ETL_RESULT" "$PRODUCTION_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "ERROR: gate result '${result}' is not success — CI / required fails." >&2
              exit 1
            fi
          done

          echo "All gates passed — CI / required is green."
