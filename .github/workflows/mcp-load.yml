name: MCP Preview load

on:
  workflow_dispatch:
    inputs:
      requests:
        description: Numero totale di richieste (massimo 500)
        required: true
        default: "100"
      concurrency:
        description: Concorrenza (massimo 25)
        required: true
        default: "10"
      p95_ms:
        description: Budget p95 in millisecondi
        required: true
        default: "3000"

permissions:
  contents: read

concurrency:
  group: mcp-preview-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-load:
    name: preview-load
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Preview
    env:
      MCP_PREVIEW_URL: ${{ secrets.MCP_PREVIEW_URL }}
      MCP_LOAD_ALLOW_REMOTE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require an explicit Preview endpoint
        run: test -n "$MCP_PREVIEW_URL"

      - name: Run bounded MCP load test
        env:
          LOAD_REQUESTS: ${{ inputs.requests }}
          LOAD_CONCURRENCY: ${{ inputs.concurrency }}
          LOAD_P95_MS: ${{ inputs.p95_ms }}
        run: >-
          node scripts/mcp_load.mjs
          --url "${MCP_PREVIEW_URL%/}/api/mcp"
          --requests "$LOAD_REQUESTS"
          --concurrency "$LOAD_CONCURRENCY"
          --p95-ms "$LOAD_P95_MS"
          --allow-remote
