name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test ETL contracts
        run: python -m unittest discover -s tests/etl -p 'test_*.py'

      - name: Typecheck
        run: npm run typecheck

      - name: Impeccable design detector
        run: npm run design:check

      - name: Build
        run: npm run build

      - name: Production HTTP, MCP, Browser and Lighthouse gates
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/dvns-next.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          npm run test:mcp:http
          npm run test:mcp:load -- --requests 60 --concurrency 10 --p95-ms 3000
          npm run test:browser:e2e
          npm run test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-irpef
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
