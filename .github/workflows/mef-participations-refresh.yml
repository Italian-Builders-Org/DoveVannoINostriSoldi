name: MEF public participations snapshot

on:
  push:
    branches: [main]
    paths:
      - scripts/etl/mef_participations_snapshot.py
      - src/data/generated/mef-participations-overview.json
      - tests/mef-participations.test.mjs
      - .github/workflows/mef-participations-refresh.yml
  pull_request:
    paths:
      - scripts/etl/mef_participations_snapshot.py
      - src/data/generated/mef-participations-overview.json
      - tests/mef-participations.test.mjs
      - .github/workflows/mef-participations-refresh.yml
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mef-public-participations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/etl/mef_participations_snapshot.py --check

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh official annual snapshot
        run: python scripts/etl/mef_participations_snapshot.py
      - name: Validate offline snapshot
        run: python scripts/etl/mef_participations_snapshot.py --check
      - name: Commit a new official release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- src/data/generated/mef-participations-overview.json)" ]]; then
            echo "No MEF participation release change to commit."
            exit 0
          fi
          git config user.name "dove-vanno-i-nostri-soldi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated/mef-participations-overview.json
          git commit -m "chore(data): refresh MEF participations snapshot"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
