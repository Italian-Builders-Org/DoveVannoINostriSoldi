name: SIOPE nonmunicipal snapshot

on:
  schedule:
    - cron: "17 5 8 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siope-nonmunicipal-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh SIOPE nonmunicipal snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: source-operations
    env:
      PYTHONPATH: scripts/etl:scripts/ci
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
      - name: Install locked dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-etl.txt
          npm ci --ignore-scripts
      - name: Acquire and prepare the SIOPE candidate
        run: python scripts/etl/siope_nonmunicipal_refresh.py
      - name: Validate every correlated artifact and regression offline
        env:
          DVNS_OFFLINE_GUARD: "1"
        run: |
          python scripts/ci/check-siope-nonmunicipal-refresh.py
          python -m unittest discover -s tests/etl -p 'test_siope_nonmunicipal*.py'
          node --experimental-strip-types --test tests/siope-nonmunicipal.test.mjs tests/integrated-curated-datasets.test.mjs tests/integrated-source-public-view.test.mjs
      - name: Propose validated data through the managed publisher
        uses: ./.github/actions/publish-data-refresh
        with:
          artifact-id: siope-nonmunicipal
          app-client-id: ${{ vars.DATA_BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DATA_BOT_APP_PRIVATE_KEY }}
