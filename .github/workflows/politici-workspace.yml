name: Politici isolated workspace

on:
  push:
    branches: [feat/politici-parliament-explorer]
    paths: [.github/workflows/politici-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Package tracked public files and exact Node runtime
        run: |
          mkdir -p /tmp/politici-workspace
          git archive --format=tar HEAD | gzip -1 > /tmp/politici-workspace/repository.tar.gz
          gzip -c "$(command -v node)" > /tmp/politici-workspace/node.gz
          git rev-parse HEAD > /tmp/politici-workspace/revision.txt
      - name: Observe official European Parliament directory
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.request
          folder = pathlib.Path('/tmp/politici-workspace')
          for label, url in {
              'europarl': 'https://www.europarl.europa.eu/meps/it/full-list/xml',
              'europarl-legal': 'https://www.europarl.europa.eu/legal-notice/it/',
          }.items():
              record = {'url': url, 'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'DoveVannoINostriSoldi/1.0 (+https://www.dovevannoinostrisoldi.com)'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read(2_000_001)
                      if len(body) > 2_000_000:
                          raise ValueError('Response exceeds research budget')
                      record.update(status=response.status, contentType=response.headers.get('Content-Type'), sha256=hashlib.sha256(body).hexdigest())
                      (folder / f'{label}.raw').write_bytes(body)
              except Exception as error:
                  record['error'] = str(error)
              (folder / f'{label}.observation.json').write_text(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: politici-full-source
          path: /tmp/politici-workspace/
          retention-days: 2
          if-no-files-found: error
