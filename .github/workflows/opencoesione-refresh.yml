name: OpenCoesione national snapshot

on:
  push:
    branches:
      - main
      - feat/opencoesione-dashboard
    paths:
      - scripts/etl/opencoesione_snapshot.py
      - src/lib/data/opencoesione-contract.ts
      - src/data/generated/opencoesione-overview.json
      - tests/opencoesione-contract.test.mjs
      - .github/workflows/opencoesione-refresh.yml
  pull_request:
    paths:
      - scripts/etl/opencoesione_snapshot.py
      - src/lib/data/opencoesione-contract.ts
      - src/data/generated/opencoesione-overview.json
      - tests/opencoesione-contract.test.mjs
      - .github/workflows/opencoesione-refresh.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencoesione-national-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate committed snapshot offline
        run: python scripts/etl/opencoesione_snapshot.py --check

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh official snapshot
        run: python scripts/etl/opencoesione_snapshot.py

      - name: Validate offline fallback
        run: python scripts/etl/opencoesione_snapshot.py --check

      - name: Commit new official release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- src/data/generated/opencoesione-overview.json)" ]]; then
            echo "No OpenCoesione release change to commit."
            exit 0
          fi

          git config user.name "dove-vanno-i-nostri-soldi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated/opencoesione-overview.json
          git commit -m "chore(data): refresh OpenCoesione snapshot"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
